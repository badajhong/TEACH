# @package task
defaults:
  # Robot-only tracking: no object asset, and no object observations, rewards,
  # terminations or randomization. Everything else matches rl/base.yaml.
  - /task/base/tracking-base
  - _self_

name: R1RlMotionBase

enable_cameras: false
num_envs: 4096
reset_observation_mode: zero # Same as rl/base.yaml teachers.

sim:
  startup_physics_steps: 1

viewer:
  env_spacing: 5.0
  lookat: [0.6, 0.4, 0.7]
  eye: [3.0, -3.0, 1.5]

terrain: plane

robot:
  name: r1
  robot_type: r1_26dof

# Same actions and actuation DR as rl/base.yaml.
action:
  fixed_joint_names: [head_pitch_joint, head_yaw_joint]
  action_scaling:
    .*_hip_yaw_joint: 0.15
    .*_hip_roll_joint: 0.15
    .*_hip_pitch_joint: 0.15
    .*_knee_joint: 0.15
    .*_ankle_pitch_joint: 0.3125
    .*_ankle_roll_joint: 0.3125
    waist_roll_joint: 0.15
    waist_pitch_joint: null # R1 has no waist pitch.
    waist_yaw_joint: 0.15
    .*_shoulder_pitch_joint: 0.375
    .*_shoulder_roll_joint: 0.375
    .*_shoulder_yaw_joint: 0.4125
    .*_elbow_joint: 0.4125
    .*_wrist_roll_joint: 0.4125
  min_delay: 2
  max_delay: 6
  alpha: [0.8, 1.0]

command:
  # RobotTracking plus the clip's foot-ground and hand-object contact labels, read from
  # the motion file, for the feet_contact reward and ref_contact_flag_future.
  _target_: active_adaptation.envs.mdp.commands.hdmi.command.RobotContactLabelTracking
  root_body_name: pelvis_link
  replay_motion: false

  tracking_keypoint_names:
    - pelvis_link
    - left_hip_roll_link
    - left_knee_link
    - left_ankle_roll_link
    - right_hip_roll_link
    - right_knee_link
    - right_ankle_roll_link
    - waist_yaw_link
    - left_shoulder_roll_link
    - left_elbow_link
    - left_wrist_roll_link
    - right_shoulder_roll_link
    - right_elbow_link
    - right_wrist_roll_link

  tracking_joint_names:
    - .*_hip_.*_joint
    - .*_knee_joint
    - .*_ankle_.*_joint
    - waist_(roll|yaw)_joint
    - .*_shoulder_.*_joint
    - .*_elbow_joint
    - .*_wrist_roll_joint

  pose_range:
    x: [-0.05, 0.05]
    y: [-0.05, 0.05]
    z: [-0.01, 0.01]
    roll: [-0.1, 0.1]
    pitch: [-0.1, 0.1]
    yaw: [-0.2, 0.2]
  velocity_range:
    x: [-0.1, 0.1]
    y: [-0.1, 0.1]
    z: [-0.05, 0.05]
    roll: [-0.1, 0.1]
    pitch: [-0.1, 0.1]
    yaw: [-0.1, 0.1]
  init_joint_pos_noise: 0.1
  init_joint_vel_noise: 0.1

# tracking-base already omits object_, object_geo_ and the object/contact priv terms.
# vel_command matches the _stu tasks; ref_contact_flag_future is the clip's contact
# label, not simulated object state.
observation:
  vel_command:
    ref_root_vel_future_b: {}
    ref_contact_flag_future: {}
  priv:
    body_height:
      body_names: [.*_ankle_roll_link, pelvis_link, waist_yaw_link]

reward:
  tracking:
    tracking_upper_body_pos(keypoint_pos_tracking_local_product):
      body_names: [.*_shoulder_roll_link, .*_elbow_link, .*_wrist_roll_link]
      weight: 0.5
      sigma: 0.5
    tracking_upper_body_ori(keypoint_ori_tracking_local_product):
      body_names: [.*_shoulder_roll_link, .*_elbow_link, .*_wrist_roll_link]
      weight: 0.5
      sigma: 1.0
    tracking_lower_body_pos(keypoint_pos_tracking_local_product):
      body_names: [.*_hip_roll_link, .*_knee_link, .*_ankle_roll_link]
      weight: 0.5
      sigma: 0.5
    tracking_lower_body_ori(keypoint_ori_tracking_local_product):
      body_names: [.*_hip_roll_link, .*_knee_link, .*_ankle_roll_link]
      weight: 0.5
      sigma: 1.0
    tracking_root_pos(keypoint_pos_tracking_product):
      body_names: [pelvis_link]
      weight: 0.5
      sigma: 0.5
    tracking_root_ori(keypoint_ori_tracking_product):
      body_names: [pelvis_link]
      weight: 0.5
      sigma: 0.5
    tracking_body_linvel(keypoint_lin_vel_tracking_product):
      body_names: [pelvis_link, .*_hip_roll_link, .*_knee_link, .*_ankle_roll_link, waist_yaw_link, .*_shoulder_roll_link, .*_elbow_link, .*_wrist_roll_link]
      weight: 0.5
      sigma: 0.5
    tracking_body_angvel(keypoint_ang_vel_tracking_product):
      body_names: [pelvis_link, .*_hip_roll_link, .*_knee_link, .*_ankle_roll_link, waist_yaw_link, .*_shoulder_roll_link, .*_elbow_link, .*_wrist_roll_link]
      weight: 0.5
      sigma: 2.5
    joint_pos_tracking_product:
      joint_names: [.*_hip_.*_joint, .*_knee_joint, .*_ankle_.*_joint, waist_(roll|yaw)_joint, .*_shoulder_.*_joint, .*_elbow_joint, .*_wrist_roll_joint]
      weight: 0.5
      sigma: 0.5
    joint_vel_tracking_product:
      joint_names: [.*_hip_.*_joint, .*_knee_joint, .*_ankle_.*_joint, waist_(roll|yaw)_joint, .*_shoulder_.*_joint, .*_elbow_joint, .*_wrist_roll_joint]
      weight: 0.5
      sigma: 2.0
  # tracking-base differs from hdmi-base here; restore hdmi-base's feet terms.
  feet:
    feet_air_time:      {weight: 1.0, enabled: false, body_names: .*ankle_roll_link, thres: 0.3, soft_discount: 1.0}
    feet_air_lift:      {weight: 1.0, enabled: false, body_names: .*ankle_roll_link, low_thres: 0.10, high_thres: 0.18, sigma: 1.0}
    feet_contact:       {weight: 1.0, enabled: false, body_names: .*ankle_roll_link, sigma: 0.25}
  debug:
    root_pos_error(keypoint_pos_error):
      body_names: [pelvis_link]
      weight: 1.0
      enabled: false
    root_ori_error(keypoint_ori_error):
      body_names: [pelvis_link]
      weight: 1.0
      enabled: false
    body_pos_error_local(keypoint_pos_error_local):
      body_names: [.*_hip_roll_link, .*_knee_link, .*_ankle_roll_link, .*_shoulder_roll_link, .*_elbow_link, .*_wrist_roll_link]
      weight: 1.0
      enabled: false
    body_ori_error_local(keypoint_ori_error_local):
      body_names: [.*_hip_roll_link, .*_knee_link, .*_ankle_roll_link, .*_shoulder_roll_link, .*_elbow_link, .*_wrist_roll_link]
      weight: 1.0
      enabled: false
    joint_pos_error:
      joint_names: [.*_hip_.*_joint, .*_knee_joint, .*_ankle_.*_joint, waist_(roll|yaw)_joint, .*_shoulder_.*_joint, .*_elbow_joint, .*_wrist_roll_joint]
      weight: 1.0
      enabled: false

# Robot randomization from rl/base.yaml; body mass and joint offset come from tracking-base.
randomization:
  perturb_body_materials:
    body_names: [.*ankle_roll_link, .*wrist_roll_link]
    static_friction_range: [0.3, 1.6]
    dynamic_friction_range: [0.3, 1.2]
    restitution_range: [0.0, 0.2]
  perturb_body_com:
    body_names: [pelvis_link, waist_yaw_link]
    com_range: [-0.02, 0.02]

termination:
  cum_body_pos_error: {body_names: waist_yaw_link, min_steps: 25, threshold: 0.5}
  cum_body_ori_error: {body_names: waist_yaw_link, min_steps: 25, threshold: 1.2}

# @package task
defaults:
  - /task/R1/rl/motion_base
  - _self_

name: R1RlSub3Largebox003NoObj

# Motion-only copy of sub3_largebox_003_tea: the same clip, robot rewards, terminations
# and robot randomization, with no box in the scene. Use algo=flashsac_vel_train_no_obj.
command:
  data_path: data/motion/r1/rl/largebox/sub3_largebox_003

robot:
  override_params:
    soft_joint_pos_limit_factor: 0.95

# Robot-side reward changes from largebox_base.yaml.
reward:
  tracking:
    joint_pos_tracking_product: {sigma: 0.25}
    joint_vel_tracking_product: {sigma: 2.5}
  loco:
    joint_pos_limits: {weight: 15.0, joint_names: ".*", soft_factor: 0.95, enabled: true}
  feet:
    feet_contact: {weight: 1.0, enabled: true, body_names: .*ankle_roll_link, sigma: 0.25}
    feet_air_time: null
    feet_air_lift: null
  debug:
    feet_air_time: null
    joint_pos_limits: {soft_factor: 0.95}

# @package task
defaults:
  - /task/R1/rl/base
  - _self_

name: R1RlLargeboxBase

camera_sensor:
  # Sensor-only, invisible ~2k-face copy of the box. The visual and collision
  # meshes in the HOI USD are unchanged and keep their per-env size variation.
  object_depth_proxy_usd: objects/r1_largebox_depth_proxy.usda

robot:
  override_params:
    # Match the R1 soft margin used below when clamping reset joint states.
    soft_joint_pos_limit_factor: 0.95

# The parent supplies R1 joint/body names, 24 action scales, the largebox asset,
# and the converted sub3_largebox_003 motion. Sample the full reference clip;
# the G1 box task's reset_range [0, 100] covers only this clip's synthetic lead-in.
command:
  reset_range: null

# Use the G1 box task's object domain randomization for the single R1 largebox.
# Size is sampled per environment when the USD is spawned; mass and material
# properties are sampled per environment at simulation startup.
randomization:
  object_body_randomization:
    static_dynamic_friction_ratio_range: [1.0, 2.0]
    dynamic_friction_range: [0.3, 0.8]
    restitution_range: [0.0, 0.2]
    mass_range: [1.0, 1.8]
  body_scale:
    name: largebox_link
    scale_range: [0.7, 1.0]
    randomize_source_scale: true

# Follow G1/vaic/box_general_tracking_tea's tracking/object/regularization
# rewards using the parent's R1 body mappings. There is no stairslope object.
reward:
  tracking:
    joint_pos_tracking_product: {sigma: 0.25}
    joint_vel_tracking_product: {sigma: 2.5}
  loco:
    # R1's HOI FlashSAC preset uses 0.95. The copied G1 factor 0.8 strongly
    # penalizes valid hip/ankle poses in this reference (up to 0.424 rad).
    joint_pos_limits: {weight: 15.0, joint_names: ".*", soft_factor: 0.95, enabled: true}
    # No waist_pos_limits: that implementation requires waist_pitch_joint.
  feet:
    feet_contact: {weight: 1.0, enabled: true, body_names: .*ankle_roll_link, sigma: 0.25}
    # This clip has short asymmetric swings and about 7-9 cm peak clearance.
    # G1's 0.3 s air-time and 12-15 cm lift targets would fight the reference.
    feet_air_time: null
    feet_air_lift: null
  debug:
    feet_air_time: null
    joint_pos_limits: {soft_factor: 0.95}

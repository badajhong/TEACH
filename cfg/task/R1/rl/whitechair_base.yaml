# @package task
defaults:
  # Reuse the common R1 tracking/action/reward settings.
  - /task/R1/rl/base
  - _self_

name: R1RlWhitechairBase

command:
  data_path: data/motion/r1/rl/whitechair/sub4_whitechair_029
  object_asset_name: whitechair_link
  object_body_name: baseLink

  # Median source hand-contact targets in the object's local frame.
  contact_target_pos_offset:
    - [-0.275948, -0.033353, 0.126038]
    - [-0.007671, -0.207861, -0.086427]

randomization:
  body_scale:
    name: whitechair_link
    scale_range: [0.8, 1.1]
    homogeneous_scale: true
    randomize_source_scale: true

# @package task
defaults:
  # Reuse the common R1 tracking/action/reward settings.
  - /task/R1/rl/base
  - _self_

name: R1RlSuitcaseBase

command:
  data_path: data/motion/r1/rl/suitcase/sub5_suitcase_000
  object_asset_name: suitcase_link
  object_body_name: suitcase_link

  # Median source hand-contact targets in the object's local frame.
  contact_target_pos_offset:
    - [-0.005666, 0.047052, -0.169955]
    - [-0.175580, 0.042460, -0.004829]

# Per-object ranges from HOI train_r1/objects/objects_parm.yaml. HOI adds its
# mass range to the 0.1 kg URDF mass; this term sets the mass directly.
randomization:
  object_body_randomization:
    static_friction_range: [0.1, 0.2]
    dynamic_friction_range: [0.05, 0.2]
    restitution_range: [0.0, 1.0]
    mass_range: [1.1, 2.1]
  body_scale:
    name: suitcase_link
    scale_range: [0.8, 1.1]
    homogeneous_scale: true
    randomize_source_scale: true

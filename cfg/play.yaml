hydra:
  run:
    dir: ./outputs_play/${now:%Y-%m-%d}/${now:%H-%M-%S}-${task.name}-${algo.name}

headless: false

app:
  headless: ${..headless}
  enable_cameras: ${oc.select:..task.enable_cameras,false}

total_frames: -1
max_iters: -1
eval_interval: -1
save_interval: -1
seed: 0
checkpoint_path: null
vecnorm: auto # Use eval normalization only when the selected algorithm uses VecNorm.
export_policy: false
freeze_neutral_pose: false # Hold the default standing pose and refresh camera rays without physics.
save_depth_png: false
depth_png:
  directory: null # Defaults to this Hydra run's output directory / depth_png.
  env_id: 0
  interval: null # Seconds; null uses the camera update period (R1: 0.1 s).
  max_frames: 0 # Record continuously; set to 1 for a single snapshot.

camera_follow: true

wandb:
  group: ${oc.select:..task.name}
  run_name: ${oc.select:..task.name,test}-${oc.select:..algo.name,none}
  job_type: train
  project: haic
  mode: online # set to 'disabled' when debugging locally
  run_id: 
  monitor_gym: True
  tags: 


defaults:
  - task: G1/G1Track-walk
  - algo: ppo
  - _self_

task:
  num_envs: 16
